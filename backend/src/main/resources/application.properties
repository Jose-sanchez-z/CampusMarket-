spring.application.name=demo
server.port=8080

# --- CONEXION A POSTGRESQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/campusmarket
# Generalmente es este el usuario por defecto de Postgres
spring.datasource.username=postgres
# Coloca aqui la contrasena local de tu PostgreSQL (NO la subas a GitHub)
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- SESION Y CORS ---
app.sesion.horas=24
app.cors.origen=http://localhost:5173
app.cookie.secure=false
app.cookie.samesite=Lax

# --- ENVIO DE CODIGO POR GMAIL (Cuenta oficial del proyecto) ---
campusmarket.correo.dominio=gmail.com
campusmarket.token.minutos-vigencia=15
campusmarket.correo.remitente=campusmarket84@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=campusmarket84@gmail.com
# Pide la clave de aplicacion de 16 letras en el grupo de WhatsApp y pegala aqui en local (NO la subas a GitHub)
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Almacenamiento de imagenes (S2-T12)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.imagenes.directorio=uploads/imagenes